name: deploy рупочта.рф

# Runs the deployment from CI instead of from someone's laptop: the runner
# reaches the Proxmox API, renames the guest, installs the service inside it and
# checks the result. Manual trigger only — this touches a live mail server.
#
# Needs one repository secret:
#   PVE_PASSWORD — the secret for the login given in `pve_user`: an account
#                  password, or (preferred) the secret of a scoped Proxmox API
#                  token, in which case `pve_user` is the token id.
#
# A token is the same shape other tooling already uses against this cluster —
# the id as `pve_user`, the secret here — reaching the API through the public
# nginx front end on 443, so certificate verification stays on. Note that a
# read-only monitoring token is not enough: this job renames a guest and runs
# commands inside it, so the token needs write scope (PVEVMAdmin on the guest,
# or VM.Config + VM.Monitor + VM.GuestAgent.*).
#
# Put the workflow behind an environment with required reviewers if you want a
# second pair of eyes before anything is applied.

on:
  workflow_dispatch:
    inputs:
      pve_host:
        description: "Proxmox API host:port. 443 goes through the nginx front end; 8006 is the raw pveproxy port"
        required: true
        default: "pve.lets-mobile.ru:443"
      pve_user:
        description: "Proxmox login (claude@lm.local) or API token id (claude@lm.local!deploy)"
        required: true
        default: "claude@lm.local"
      vm:
        description: "Guest vmid, exact name, or unique name fragment"
        required: true
        # The guest has already been renamed, so the old "mail" no longer
        # resolves — a dispatch that keeps the defaults must still find it.
        default: "rupochta-rf"
      new_name:
        description: "New guest name"
        required: true
        default: "rupochta-rf"
      apply:
        description: "Actually make changes (unchecked = dry run)"
        type: boolean
        default: false
      purge_mailboxes:
        description: "Also delete the lets-mobile mailboxes — destroys mail"
        type: boolean
        default: false
      insecure_tls:
        description: "Skip TLS verification — only needed when talking to pveproxy's self-signed certificate on 8006"
        type: boolean
        default: false

# One deployment at a time, and never cancel one midway.
concurrency:
  group: deploy-rupochta-rf
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Report what this run will do
        run: |
          echo "host:      ${{ inputs.pve_host }}"
          echo "guest:     ${{ inputs.vm }} -> ${{ inputs.new_name }}"
          echo "apply:     ${{ inputs.apply }}"
          echo "purge:     ${{ inputs.purge_mailboxes }}"
          if [ "${{ inputs.apply }}" != "true" ]; then
            echo "::notice::Dry run — nothing will be changed."
          fi

      - name: Provision through the Proxmox API
        env:
          PVE_PASSWORD: ${{ secrets.PVE_PASSWORD }}
        run: |
          if [ -z "$PVE_PASSWORD" ]; then
            echo "::error::PVE_PASSWORD secret is not set — add it in Settings → Secrets → Actions"
            exit 1
          fi
          args=(
            --host "${{ inputs.pve_host }}"
            --user "${{ inputs.pve_user }}"
            --vm "${{ inputs.vm }}"
            --new-name "${{ inputs.new_name }}"
            --branch "${{ github.ref_name }}"
            --repo "${{ github.server_url }}/${{ github.repository }}.git"
          )
          [ "${{ inputs.apply }}" = "true" ] && args+=(--apply)
          [ "${{ inputs.purge_mailboxes }}" = "true" ] && args+=(--purge-mailboxes)
          [ "${{ inputs.insecure_tls }}" = "true" ] && args+=(--insecure)
          python3 deploy/pve-remote-provision.py "${args[@]}"

      - name: Verify the public service
        if: inputs.apply
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq dnsutils
          ./deploy/verify-rupochta-rf.sh || {
            echo "::warning::The service is not fully live yet — see the failed checks above."
            echo "::warning::DNS delegation and the TLS certificate are done outside this workflow."
            exit 0
          }
