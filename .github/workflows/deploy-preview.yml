name: deploy preview

on:
  pull_request:
    paths:
      - "docs/**"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-preview.yml"

# Секреты среды недоступны сборкам из форков, поэтому деплой preview
# выполняется только для PR внутри основного репозитория.
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: deploy-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    environment: preview
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v4
        id: deploy
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.118.0"
          command: versions upload

      - name: Оставить ссылку на preview в PR
        uses: actions/github-script@v7
        with:
          script: |
            const body = `## 🔍 Preview deployment\n\nПревью задеплоено на Cloudflare Workers.\nОткройте вкладку **Deployments** → **preview** в Cloudflare Dashboard для ссылки.`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
