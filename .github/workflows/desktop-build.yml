name: Desktop Build (Tauri)

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows exe + msi
    runs-on: windows-latest
    defaults:
      run:
        working-directory: rupochta-desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JS deps (tauri cli)
        run: npm install

      - name: Build bundles (NSIS + MSI)
        run: npm run tauri build

      - name: Upload bundles as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: rupochta-desktop-bundles
          path: |
            rupochta-desktop/src-tauri/target/release/bundle/nsis/*.exe
            rupochta-desktop/src-tauri/target/release/bundle/msi/*.msi
            rupochta-desktop/src-tauri/target/release/rupochta-desktop.exe
          if-no-files-found: error

      - name: Publish GitHub Release (draft)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: "RuPochta Desktop ${{ github.ref_name }}"
          body: |
            Windows-приложение RuPochta (вход, регистрация, рабочее место «Фокус»).

            - RuPochta_*_x64-setup.exe — установщик NSIS
            - RuPochta_*_x64_en-US.msi — MSI (WiX)
            - rupochta-desktop.exe — портативный exe

            Фронтенд: V3-сборка стартовой страницы. Иконка — из 3D-логотипа RuPochta.
          files: |
            rupochta-desktop/src-tauri/target/release/bundle/nsis/*.exe
            rupochta-desktop/src-tauri/target/release/bundle/msi/*.msi
            rupochta-desktop/src-tauri/target/release/rupochta-desktop.exe
