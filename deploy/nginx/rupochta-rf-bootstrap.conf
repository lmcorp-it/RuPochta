# Temporary HTTP-only front end for рупочта.рф, used until a certificate exists.
#
# The production config (rupochta-rf.conf) names files under
# /etc/letsencrypt/live/, so nginx refuses to load it before certbot has run.
# Enabling it too early does not merely lose HTTPS — nginx does not start at
# all, so nothing answers on :80 either, so the ACME HTTP-01 challenge cannot
# be served, so the certificate can never be obtained. This file breaks that
# deadlock: it serves the challenge webroot and proxies the application over
# plain HTTP, and bootstrap-rupochta-rf.sh swaps back to the real config the
# moment a certificate is in place.
#
# Plain HTTP at the origin is only safe when something else terminates TLS in
# front of it (a CDN, a tunnel) — mailbox passwords cross this hop. Treat it as
# a step in the install, not a resting state: run the script with --tls, or
# `certbot certonly --webroot -w /var/www/certbot -d xn--80a1acdmd4a.xn--p1ai`
# and re-run the script.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name xn--80a1acdmd4a.xn--p1ai www.xn--80a1acdmd4a.xn--p1ai
                mail.xn--80a1acdmd4a.xn--p1ai _;

    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Attachments and inline images; the app itself caps message size.
    client_max_body_size 32m;

    # Never redirected — a renewal must work even when the site is otherwise down.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /api/signup {
        limit_req zone=rupochta_signup burst=3 nodelay;
        include /etc/nginx/snippets/rupochta-proxy.conf;
        proxy_pass http://127.0.0.1:18400;
    }

    location / {
        include /etc/nginx/snippets/rupochta-proxy.conf;
        proxy_pass http://127.0.0.1:18400;
    }
}
