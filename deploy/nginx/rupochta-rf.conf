# nginx front end for рупочта.рф (punycode: xn--80a1acdmd4a.xn--p1ai).
#
# RuPochta listens on loopback and trusts this proxy for two things it cannot
# work out on its own:
#   X-Real-IP          — rate limiting and the public-signup limiter key on it
#   X-Forwarded-Proto  — the same-origin check builds https:// from it, and
#                        writes are refused when the origin does not match
# Install to /etc/nginx/sites-available/rupochta-rf.conf and symlink it.

server {
    listen 80;
    listen [::]:80;
    server_name xn--80a1acdmd4a.xn--p1ai www.xn--80a1acdmd4a.xn--p1ai
                mail.xn--80a1acdmd4a.xn--p1ai;

    # Leave ACME on plain HTTP so renewals never depend on the certificate.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://xn--80a1acdmd4a.xn--p1ai$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.xn--80a1acdmd4a.xn--p1ai mail.xn--80a1acdmd4a.xn--p1ai;

    ssl_certificate     /etc/letsencrypt/live/xn--80a1acdmd4a.xn--p1ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn--80a1acdmd4a.xn--p1ai/privkey.pem;

    return 301 https://xn--80a1acdmd4a.xn--p1ai$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name xn--80a1acdmd4a.xn--p1ai;

    ssl_certificate     /etc/letsencrypt/live/xn--80a1acdmd4a.xn--p1ai/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn--80a1acdmd4a.xn--p1ai/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:RuPochtaTLS:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # Attachments and inline images; the app itself caps message size.
    client_max_body_size 32m;

    # Registration is the one unauthenticated write on the service, so it gets
    # its own bucket in front of the application-level per-hour limit.
    location = /api/signup {
        limit_req zone=rupochta_signup burst=3 nodelay;
        proxy_pass http://127.0.0.1:18400;
        include /etc/nginx/snippets/rupochta-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:18400;
        include /etc/nginx/snippets/rupochta-proxy.conf;
    }
}
