# Shared proxy headers for RuPochta. Include from every location block.
#
# X-Real-IP must be $remote_addr — the app treats it as trusted and keys rate
# limiting on it, so it must never be a client-supplied value.
#
# X-Forwarded-Proto comes from $rupochta_forwarded_proto (conf.d/rupochta-limits.conf)
# rather than $scheme, so the app still sees https when TLS is terminated by a
# CDN or tunnel in front of this nginx.

proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $rupochta_forwarded_proto;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        "";

proxy_connect_timeout 10s;
proxy_send_timeout    120s;
proxy_read_timeout    120s;
proxy_buffering       off;
