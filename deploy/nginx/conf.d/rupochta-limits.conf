# http{}-context settings for RuPochta, so this file belongs in
# /etc/nginx/conf.d/ rather than in the site config.
#
# The live ingress is cloudflared -> http://127.0.0.1:80. Restore the visitor
# address before either nginx or the application uses $remote_addr, but accept
# CF-Connecting-IP only from that local tunnel peer. A direct client can send
# the same header, but cannot make nginx trust it.
set_real_ip_from 127.0.0.1/32;
set_real_ip_from ::1/128;
real_ip_header CF-Connecting-IP;
real_ip_recursive off;

# $remote_addr may have been replaced above; $realip_remote_addr always keeps
# the TCP peer. Use the latter for every forwarded-header trust decision.
geo $realip_remote_addr $rupochta_trusted_forwarder {
    default      0;
    127.0.0.1/32 1;
    ::1/128      1;
}

# One registration per ten seconds per restored visitor address, bursting to
# three, sits in front of the application's own MAIL_PUBLIC_SIGNUP_PER_HOUR
# limit: nginx stops a flood cheaply, the app enforces the real policy.

limit_req_zone $binary_remote_addr zone=rupochta_signup:10m rate=6r/m;

# Which scheme the *browser* used, which is not always the scheme that reached
# this nginx. When a CDN or tunnel terminates TLS ahead of us, the visitor is on
# https while our own $scheme is http; passing $scheme on would make the app
# expect an http:// Origin and refuse every write, registration included.
#
# Only a trusted loopback peer may supply either real value. Anything else —
# including a valid-looking forged header on a direct request — falls back to
# the scheme nginx actually observed.
map "$rupochta_trusted_forwarder:$http_x_forwarded_proto" $rupochta_forwarded_proto {
    default $scheme;
    "1:http"  http;
    "1:https" https;
}
