# Rate-limit zones for RuPochta. Must live in the http{} context, so this file
# belongs in /etc/nginx/conf.d/ rather than in the site config.
#
# One registration per ten seconds per address, bursting to three, sits in
# front of the application's own MAIL_PUBLIC_SIGNUP_PER_HOUR limit: nginx stops
# a flood cheaply, the app enforces the real policy.

limit_req_zone $binary_remote_addr zone=rupochta_signup:10m rate=6r/m;
