# Обратный прокси перед RuПочтой. TLS-сертификат — тот же, что использует
# docker-mailserver (/etc/letsencrypt/live/<FQDN>), так что обновление certbot
# закрывает и веб, и IMAP/SMTP.

# Для WebSocket/SSE-соединений веб-интерфейса.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name __MAIL_FQDN__;

    # Единственное, что отдаётся по HTTP, — ACME-челлендж.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __MAIL_FQDN__;

    ssl_certificate     /etc/letsencrypt/live/__MAIL_FQDN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__MAIL_FQDN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Вложения: письмо у docker-mailserver ограничено 50 МиБ (POSTFIX_MESSAGE_SIZE_LIMIT).
    client_max_body_size 64m;

    location / {
        proxy_pass http://127.0.0.1:18400;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # /health — процесс жив, /ready — доступны IMAP и SMTP.
    location = /health {
        proxy_pass http://127.0.0.1:18400/health;
        access_log off;
    }
}
