# Локальный стенд для разработки: RuПочта + встроенный IMAP/SMTP-сервер.
# Не для продакшена — все секреты и пароли демонстрационные.
#
#   cp .env.dev.example .env.dev
#   docker compose -f docker-compose.dev.yml --env-file .env.dev up --build
#
# Веб-интерфейс: http://localhost:18400
# Демо-ящик:    demo@example.local / demo-password
#
# Greenmail — легковесный тестовый IMAP/SMTP-сервер на Java, разворачивает
# ящики из переменной GREENMAIL_OPTS без внешних конфигов.

services:
  mailserver:
    image: greenmail/standalone:2.1.3
    container_name: rupochta-dev-mailserver
    environment:
      # users=login:password@domain,login2:password2@domain
      # порты: SMTP 3025, IMAP 3143, IMAPS 3993, SMTPS 3465, POP3 3110
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.all
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.auth.disabled
        -Dgreenmail.users=demo:demo-password@example.local,alice:alice-password@example.local,bob:bob-password@example.local
        -Dgreenmail.verbose
    ports:
      # проброшены наружу для отладки почтовыми клиентами, серверу не нужны
      - "127.0.0.1:3025:3025"   # SMTP
      - "127.0.0.1:3143:3143"   # IMAP
      - "127.0.0.1:3465:3465"   # SMTPS
      - "127.0.0.1:3993:3993"   # IMAPS
    healthcheck:
      test: ["CMD-SHELL", "(echo > /dev/tcp/127.0.0.1/3143) 2>/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  rupochta:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rupochta-dev-server
    depends_on:
      mailserver:
        condition: service_healthy
    environment:
      MAIL_DOMAIN: ${MAIL_DOMAIN:-example.local}
      MAIL_HOST: mailserver
      MAIL_IMAP_HOST: mailserver
      MAIL_IMAP_PORT: "3143"
      MAIL_SMTP_HOST: mailserver
      MAIL_SMTP_PORT: "3025"
      MAIL_SMTP_VERIFY_TLS: "0"
      MAIL_PUBLIC_HOST: localhost
      MAIL_PUBLIC_IMAP_PORT: "3143"
      MAIL_PUBLIC_SMTP_PORT: "3025"
      MAIL_WEBMAIL_URL: http://localhost:18400
      MAILADMIN_SSO_PUBLIC_URL: http://localhost:18400
      WEBMAIL_SECRET_KEY: ${WEBMAIL_SECRET_KEY:-dev-secret-do-not-use-in-prod-xxxxxxxxxxxxxxxx}
      MAIL_ADMIN_KEY: ${MAIL_ADMIN_KEY:-dev-admin-key}
      WEBMAIL_DB: /data/webmail_aliases.db
    volumes:
      - rupochta-dev-data:/data
    ports:
      - "127.0.0.1:18400:18400"
    restart: unless-stopped

volumes:
  rupochta-dev-data:
